<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Finger Trails Adventure</title><style>body{margin:0;background:#eaf7ff;font-family:system-ui,-apple-system,sans-serif;color:#17324d;touch-action:none;user-select:none}header{text-align:center;padding:12px 8px}h1{font-size:clamp(24px,5vw,36px);margin:0}p{margin:5px}#game{display:block;background:white;border:5px solid #74c8e8;border-radius:24px;width:min(94vw,900px);height:min(66vh,560px);margin:auto;touch-action:none}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}button{font-size:19px;font-weight:700;border:0;border-radius:18px;padding:13px 19px;background:#ffd56b;color:#253047}button.active{background:#63d4b2}#status{text-align:center;font-size:22px;font-weight:700;min-height:28px}footer{text-align:center;font-size:13px;padding:4px}</style></head><body><header><h1>🌈 Finger Trails Adventure</h1><p id="instruction">Drag the star along the rainbow road!</p></header><canvas id="game" aria-label="Touch and drag fine motor game"></canvas><div id="status" aria-live="polite"></div><nav><button onclick="choose(0)" id="b0">⭐ Trail</button><button onclick="choose(1)" id="b1">🫧 Bubbles</button><button onclick="choose(2)" id="b2">🐰 Feed</button><button onclick="choose(3)" id="b3">✏️ Shapes</button><button onclick="reset()">🔄 Again</button></nav><footer>Use one finger. Take breaks whenever needed. Works offline after saving.</footer><script>
const c=document.getElementById('game'),x=c.getContext('2d'),status=document.getElementById('status'),instruction=document.getElementById('instruction');let mode=0,items=[],held=-1,progress=0,trail=[],done=false,shape=0;const W=900,H=560;function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(c.width/W,0,0,c.height/H,0,0);draw()}addEventListener('resize',resize);function rand(a,b){return a+Math.random()*(b-a)}function choose(n){mode=n;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===n));reset()}function reset(){held=-1;progress=0;done=false;trail=[];status.textContent='';if(mode===0){instruction.textContent='Touch the star and follow the colourful road!';for(let i=0;i<=100;i++){let t=i/100;trail.push({x:80+740*t,y:280+125*Math.sin(t*Math.PI*3)})}}if(mode===1){instruction.textContent='Pop all the bubbles with your finger!';items=Array.from({length:10},(_,i)=>({x:110+(i%5)*170+rand(-20,20),y:135+Math.floor(i/5)*260+rand(-45,45),r:rand(36,53),hit:false}))}if(mode===2){instruction.textContent='Drag the carrots into the bunny’s mouth!';items=Array.from({length:5},(_,i)=>({x:100+i*145,y:420,homeX:100+i*145,homeY:420,hit:false}))}if(mode===3){instruction.textContent='Trace the dotted shape with your finger!';let fn=[t=>({x:450+170*Math.cos(t*2*Math.PI),y:270+170*Math.sin(t*2*Math.PI)}),t=>({x:160+580*t,y:280+135*Math.sin(t*Math.PI*4)}),t=>({x:450+175*(1-t)*Math.cos(t*6*Math.PI),y:280+175*(1-t)*Math.sin(t*6*Math.PI)})][shape%3];trail=Array.from({length:151},(_,i)=>fn(i/150))}draw()}
function background(){x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);for(let i=0;i<18;i++){x.fillStyle='#f1faff';x.beginPath();x.arc((i*197)%900,(i*137)%560,25+(i%4)*10,0,7);x.fill()}}function circle(px,py,r,color){x.fillStyle=color;x.beginPath();x.arc(px,py,r,0,7);x.fill()}function message(t){status.textContent=t}function success(){if(!done){done=true;message('🎉 Fantastic finger work!');setTimeout(()=>{if(mode===3){shape++;reset()}},1100)}}function draw(){background();if(mode===0||mode===3){x.lineCap='round';x.lineJoin='round';x.lineWidth=mode===0?72:65;x.strokeStyle='#e7edf2';x.beginPath();trail.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();x.lineWidth=mode===0?42:36;x.strokeStyle=mode===0?'#ffd86e':'#b9e4fa';x.stroke();x.strokeStyle='#52c79c';x.lineWidth=13;x.beginPath();trail.slice(0,Math.max(1,progress+1)).forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();if(mode===0){circle(80,280,39,'#ffb65c');circle(820,280,45,'#b5edb0');x.font='48px system-ui';x.textAlign='center';x.fillText('⭐',trail[Math.min(progress,100)].x,trail[Math.min(progress,100)].y+16);x.fillText('🏁',820,294)}else{x.font='44px system-ui';x.textAlign='center';let p=trail[Math.min(progress,150)];x.fillText('✏️',p.x,p.y+12)}}if(mode===1){items.forEach(b=>{if(!b.hit){circle(b.x,b.y,b.r,'#b6eafa');circle(b.x-12,b.y-12,b.r*.22,'white')}});x.font='26px system-ui';x.fillStyle='#255';x.textAlign='center';x.fillText(`${items.filter(a=>a.hit).length} / 10`,450,45)}if(mode===2){x.font='150px system-ui';x.textAlign='center';x.fillText('🐰',450,225);circle(450,210,30,'#ffbad2');items.forEach(a=>{if(!a.hit){x.font='68px system-ui';x.fillText('🥕',a.x,a.y+20)}});x.font='26px system-ui';x.fillStyle='#255';x.fillText(`${items.filter(a=>a.hit).length} / 5`,450,45)}}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function near(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function update(p,start=false){if(done)return;if(mode===1){for(let b of items)if(!b.hit&&near(p,b,b.r+10)){b.hit=true;break}if(items.every(b=>b.hit))success()}if(mode===2){if(start){held=items.findIndex(a=>!a.hit&&near(p,a,60))}if(held>=0){let a=items[held];a.x=p.x;a.y=p.y;if(near(p,{x:450,y:210},85)){a.hit=true;held=-1;if(items.every(a=>a.hit))success()}}}if(mode===0||mode===3){let limit=mode===0?100:150;let target=trail[Math.min(progress,limit)];if(near(p,target,mode===0?75:65)){for(let j=progress+1;j<=Math.min(limit,progress+7);j++){if(near(p,trail[j],mode===0?42:38))progress=j}if(progress>=limit-2)success()}}draw()}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);update(point(e),true)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')update(point(e))});c.addEventListener('pointerup',()=>{held=-1});c.addEventListener('pointercancel',()=>{held=-1});choose(0);resize();</script></body></html>
